  <title>25년간 세계 수출 순위 변화 | 2026년 나의 유성고</title>
  <style>
    :root {
      --blue-900: #0b2a5b; --blue-700: #1556b8; --blue-500: #2f80ed;
      --blue-100: #e3efff; --blue-50: #f3f8ff; --text: #14233c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: var(--blue-50); color: var(--text); line-height: 1.6;
    }
    header {
      background: linear-gradient(135deg, var(--blue-900), var(--blue-500));
      color: #fff; text-align: center; padding: 44px 20px 36px;
    }
    header h1 { margin: 0 0 10px; font-size: clamp(1.5rem, 5vw, 2.4rem); }
    header p { margin: 0; font-size: clamp(0.95rem, 2.5vw, 1.15rem); opacity: 0.92; }
    main { max-width: 900px; margin: 0 auto; padding: 28px 16px 48px; }
    footer {
      text-align: center; padding: 20px; font-size: 0.85rem;
      color: #5b6f8f; border-top: 1px solid var(--blue-100);
    }
    .frame {
      background: #fff; border: 1px solid var(--blue-100); border-radius: 16px;
      padding: 16px; box-shadow: 0 2px 8px rgba(21, 86, 184, 0.08);
    }
    .frame img { display: block; width: 100%; height: auto; border-radius: 10px; }
    .nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 20px; gap: 10px;
    }
    .nav a {
      background: var(--blue-100); color: var(--blue-700); font-weight: 700;
      padding: 8px 16px; border-radius: 10px; text-decoration: none;
    }
    .nav a:hover, .nav a:focus-visible { background: var(--blue-700); color: #fff; outline: none; }
  </style>
